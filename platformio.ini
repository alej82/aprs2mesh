[platformio]
default_envs = tbeam

[env]
build_flags = -std=gnu++17 -Wall -Wextra -Wshadow -Wconversion

[env:tbeam]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^6.6.0
build_flags =
    ${env.build_flags}
    -DAPRS2MESH_BOARD_TBEAM=1

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = ${env.build_flags}
