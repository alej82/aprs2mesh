[platformio]
default_envs = tbeam

[env]
build_flags = -std=gnu++17
build_src_flags = -Wall -Wextra -Wshadow -Wconversion

[env:tbeam]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
; Bluedroid + WiFi do not fit in the default 1.31 MB app slot. No OTA in v1,
; so trade the two OTA slots for a single 3 MB application partition.
board_build.partitions = huge_app.csv
lib_deps =
    jgromes/RadioLib@^6.6.0
build_flags =
    ${env.build_flags}
    -DAPRS2MESH_BOARD_TBEAM=1

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = ${env.build_flags}
